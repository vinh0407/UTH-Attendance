{% load static %}
<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate {% block html_class %}{% endblock %}" data-theme="{% block html_theme %}light{% endblock %}">
<head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate">
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>{% block title %}UTH Attendance & Operations{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/uth-logo.png' %}">
    
    <!-- Phosphor Icons (Local & CDN Fallback) -->
    <link rel="stylesheet" href="{% static 'icons/phosphor/style.css' %}">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#104c45",
                        "primary-hover": "#177665",
                        "primary-glow": "#10b981",
                        "primary-light": "#e8f3ed",
                        "uth-teal": "#177665",
                        "uth-dark": "#104c45",
                        "uth-sky": "#0284c7",
                        "uth-navy": "#0f2c42",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0e1a17",
                        "surface-dark": "#142622",
                        "glass-border": "rgba(255, 255, 255, 0.12)",
                        "glass-surface": "rgba(255, 255, 255, 0.05)",
                        "success": "#10b981",
                        "warning": "#f59e0b",
                        "danger": "#ef4444",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'scan-line': 'scanLine 2s linear infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        scanLine: {
                            '0%': { top: '0%' },
                            '100%': { top: '100%' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 5px rgba(43, 108, 238, 0.5), 0 0 20px rgba(43, 108, 238, 0.3)' },
                            '100%': { boxShadow: '0 0 20px rgba(43, 108, 238, 0.8), 0 0 40px rgba(43, 108, 238, 0.5)' },
                        },
                    }
                },
            },
        }
    </script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}bg-[#f5f7f8] text-[#203530]{% endblock %} relative min-h-screen flex flex-col selection:bg-[#177665] selection:text-white overflow-x-hidden">
    
    {% block content %}{% endblock %}
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[110] transform translate-y-20 opacity-0 transition-all duration-300">
        <div class="glass-card rounded-xl px-6 py-4 flex items-center gap-3 shadow-2xl">
            <span id="toastIcon" class="material-symbols-outlined text-green-400">check_circle</span>
            <span id="toastMessage" class="font-medium">Success!</span>
        </div>
    </div>
    
    <!-- Background Grid Texture Overlay -->
    <div class="absolute inset-0 pointer-events-none z-0 opacity-[0.03]" style="background-image: linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px); background-size: 40px 40px;"></div>
    
    <!-- Base JavaScript -->
    <script src="{% static 'js/main.js' %}?v=20260826"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const clock = document.getElementById('currentTime');
            if (!clock) return;
            const renderClock = () => {
                const now = new Date();
                const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                clock.textContent = `${now.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'})} • ${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
            };
            renderClock();
            window.setInterval(renderClock, 1000);
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
