{% extends 'base.html' %}
{% load static %}

{% block title %}Classes & Sessions · UTH Attendance{% endblock %}

{% block content %}
<script>
    window.location.replace("{% url 'portal:admin_dashboard' %}#schedule");
</script>
<div class="app-shell" style="align-items: center; justify-content: center; min-height: 100vh;">
    <div class="card" style="text-align: center; max-width: 440px; margin: 40px auto; padding: 36px;">
        <img src="{% static 'img/uth-logo.png' %}" alt="UTH" width="48" height="48" style="margin: 0 auto 16px;">
        <h2>Classes & Sessions Integrated</h2>
        <p class="muted" style="margin: 10px 0 24px;">The teaching schedule and session manager is now directly integrated into the Admin Dashboard.</p>
        <a class="button button-primary" href="{% url 'portal:admin_dashboard' %}#schedule">
            <i class="ph ph-calendar"></i>
            <span>Go to Admin Dashboard</span>
        </a>
    </div>
</div>
{% endblock %}
